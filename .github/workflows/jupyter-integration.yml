name: Jupyter integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install jupyterlab -r jupyter/requirements-test.txt
      - name: Build and test the frontend
        working-directory: frontend
        run: |
          npm install
          npm run test:run
          npm run build:jupyter
      - name: Build and test the Jupyter extension
        working-directory: jupyter
        run: |
          jlpm install
          jlpm build:prod
          jlpm test
