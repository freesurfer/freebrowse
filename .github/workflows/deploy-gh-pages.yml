name: Deploy to GitHub Pages

on:
  # Trigger on push to main branch
  push:
    branches:
      - main
  # Allow manual trigger from Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write   # write (not read) so the release job can create tags + releases
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Same check the publish job runs, but here it fails the run before the
      # release job creates a tag, so a bad package never leaves a half-done release.
      - name: Build and check the npm package
        working-directory: frontend
        run: npm run build:package && npm run pack:check

      - name: Build for GitHub Pages (serverless mode)
        working-directory: frontend
        env:
          VITE_BASE_PATH: '/${{ github.event.repository.name }}/'
        run: npm run build:serverless

      - name: Build single-file version
        working-directory: frontend
        env:
          VITE_SERVERLESS: 'true'
        run: |
          npm run build:singlefile
          mkdir -p dist/downloads
          cp dist-singlefile/*.html dist/downloads/

      - name: Upload single-file HTML as job artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebrowse-singlefile
          path: frontend/dist-singlefile/freebrowse-*.html
          if-no-files-found: error
          retention-days: 7

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Archive each version's single-file HTML as a GitHub Release asset so older
  # versions remain downloadable for regression testing. Idempotent: skips if a
  # release for the current frontend/package.json version already exists.
  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      # true only when this run created the release, i.e. the version is new
      published: ${{ steps.tagcheck.outputs.exists == 'false' }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from frontend/package.json
        id: ver
        working-directory: frontend
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check whether release tag already exists
        id: tagcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1 \
             || gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download single-file HTML artifact
        if: steps.tagcheck.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: freebrowse-singlefile
          path: release-assets

      - name: Create GitHub Release with single-file asset
        if: steps.tagcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: FreeBrowse v${{ steps.ver.outputs.version }}
          body: |
            Self-contained single-file build of FreeBrowse v${{ steps.ver.outputs.version }}.

            Download `freebrowse-${{ steps.ver.outputs.version }}.html` and open it directly
            (file://) or serve locally with `python3 -m http.server`.
          files: release-assets/freebrowse-*.html
          make_latest: true

  # Publish the npm package for the version the release job just tagged, so the
  # package on the registry always matches a v<version> release of main. Uses
  # npm trusted publishing (OIDC via id-token: write): no NPM_TOKEN secret, and
  # npm attaches a provenance attestation linking the package to this run. The
  # one-time setup is on npmjs.com (package Settings > Trusted Publisher:
  # GitHub Actions, freesurfer/freebrowse, deploy-gh-pages.yml).
  publish:
    runs-on: ubuntu-latest
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.published == 'true'
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Install and build with Node 22's bundled npm, the same major the build
      # job uses, so a lockfile quirk cannot fail here after the release exists.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and check the package
        working-directory: frontend
        run: npm run build:package && npm run pack:check

      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Publish to npm
        working-directory: frontend
        env:
          VERSION: ${{ needs.release.outputs.version }}
        # A pre-release version (2.6.0-next.1) goes under the `next` dist-tag so
        # `latest` keeps pointing at the last full release.
        run: |
          if [[ "$VERSION" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
